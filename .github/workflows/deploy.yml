name: Deploy Portfolio via Docker Hub to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push to Docker Hub & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Vite App
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-v2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-v2:${{ github.sha }}

      - name: Pull Image and Redeploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-v2:latest
            sudo docker stop portfolio-v2 || true
            sudo docker rm portfolio-v2 || true
            sudo docker run -d -p 80:80 -p 443:443 -v /etc/letsencrypt:/etc/letsencrypt:ro --name portfolio-v2 --restart always ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-v2:latest
            sudo docker image prune -f
